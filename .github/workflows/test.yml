name: Test
on:
  push:
  pull_request:
jobs:
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler: '2.4.22'
          bundler-cache: true
      - run: bundle exec ruby test/smoke_test.rb
      - name: Build and install gem
        run: |
          bundle exec rake build
          gem install --local --ignore-dependencies --no-document --install-dir "$RUNNER_TEMP/installed" pkg/auto_timezone-*.gem

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.js
